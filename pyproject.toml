[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rooom-rag"
version = "0.3.0"
description = "Retrieval-augmented generation engine with RooomVector integration"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ROOOMTECH"}]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sentence-transformers>=5,<6",
  "pypdf>=5.9,<6",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
